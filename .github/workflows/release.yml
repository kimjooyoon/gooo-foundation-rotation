name: Foundation authorization release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build release binary
        run: go build -trimpath -o gooo-foundation-rotation-linux-amd64 ./cmd/gooo-foundation-rotation
      - name: Build evidence bundle
        run: |
          bash scripts/ci-conformance.sh
          tar -czf gooo-foundation-rotation-evidence-${GITHUB_REF_NAME}.tar.gz -C "${RUNNER_TEMP}/gooo-foundation-rotation-${GITHUB_RUN_ID}" evidence
      - name: Publish immutable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gooo-foundation-rotation ${{ github.ref_name }}
          body: |
            Immutable verifier/protocol release. Live issuer and meta-ontology-go #619 integration remain UNKNOWN.
          files: |
            gooo-foundation-rotation-linux-amd64
            gooo-foundation-rotation-evidence-${{ github.ref_name }}.tar.gz
